name: Execute test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      CUCUMBER_REPORT_DIR: target/cucumber/

    permissions:
      pages: write
      id-token: write
      deployments: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies (skip husky)
        run: HUSKY=0 npm ci

      - name: Run Cucumber tests
        run: npm run test:ci

      - name: Save report like artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: ${{ env.CUCUMBER_REPORT_DIR }}index.html

      - name: Upload Pages artifact (test results)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.CUCUMBER_REPORT_DIR }}

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
