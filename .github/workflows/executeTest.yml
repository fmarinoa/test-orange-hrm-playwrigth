name: Execute test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    permissions:
      pages: write
      id-token: write
      deployments: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Cucumber tests
        run: npm run test:ci

      - name: Save report like artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber/report.html

      - name: Upload Pages artifact (test results)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/cucumber/report.html
